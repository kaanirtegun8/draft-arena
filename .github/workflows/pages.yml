name: Test ve GitHub Pages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Draft Arena (offline) tests
        run: npm test
      - name: Draft Arena Online tests
        working-directory: online
        run: npm test
      - name: Firebase security rules tests (emulator)
        working-directory: online/tests-rules
        run: |
          npm ci --no-audit --no-fund
          npx firebase emulators:exec --config ../firebase.json --only database --project demo-draft-arena "cd .. && node --test tests-rules/rules.test.js"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p _site/online
          cp -r index.html styles.css icon.svg manifest.webmanifest .nojekyll src _site/
          cd online && cp -r index.html styles.css icon.svg manifest.webmanifest sw.js src data ../_site/online/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
